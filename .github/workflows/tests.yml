name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (characterisation grounding and behaviour)
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit: a tag can be moved to other code, a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Hash-checked install of the full lock: nothing outside it can be pulled in.
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Compile
        run: python -m py_compile server.py accounts.py ai.py netguard.py limits.py completeness.py characterisation.py sanitisation.py scripts/import_openfoodtox.py scripts/import_epa_bioactivity.py scripts/make_sanitisation_demo.py scripts/make_completeness_demo.py scripts/filter_aopwiki_licences.py
      - name: Run tests
        run: python -m pytest -q tests
